<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline · Skul SL</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f8f5;--card:#fff;--ink:#14231a;--muted:#52625a;--line:#dde5df;--brand:#14803c;--on:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1511;--card:#16201a;--ink:#e9f1ec;--muted:#a3b3aa;--line:#2a3a31;--brand:#3ecf72;--on:#06210f}}
  body{margin:0;background:var(--bg);color:var(--ink);font:1.05rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:1rem;box-sizing:border-box}
  main{max-width:30rem;background:var(--card);border:1px solid var(--line);border-radius:1.2rem;padding:1.6rem;text-align:center}
  h1{margin:.4rem 0;font-size:1.5rem}
  p{color:var(--muted);margin:.5rem 0}
  a{display:inline-block;margin-top:.8rem;min-height:46px;line-height:46px;padding:0 1.2rem;border-radius:.9rem;background:var(--brand);color:var(--on);font-weight:650;text-decoration:none}
</style>
</head>
<body>
<main>
  <div style="font-size:3rem" aria-hidden="true">📴</div>
  <h1>You are offline</h1>
  <p>This page was not saved on your phone yet. Pages you have opened before still work.</p>
  <p>Connect once and open the lessons you want to keep, or use <strong>More → Install &amp; use offline</strong> to save a whole subject.</p>
  <a href="/">Go home</a>
</main>
</body>
</html>
